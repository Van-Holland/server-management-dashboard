# Heating plan helpers (v4, written 2026-11-21, NOT yet installed). Put in /home/matt/docker/homeassistant/config/packages/.
# The dashboard's Plan and Night test tabs write these; automations.yaml (v4) reads them.
# No `initial:` on purpose: with it, every Home Assistant restart would reset what was saved on the page.
# After the first start, set the values once (day 21, night 16, times 06:00 / 17:00 / 22:00, list 12,14,16,18).
input_number:
  verwarming_dag_temp:
    name: "Verwarming: dagtemperatuur"
    min: 10
    max: 25
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:sun-thermometer
  verwarming_nacht_temp:
    name: "Verwarming: nachttemperatuur"
    min: 10
    max: 25
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:weather-night
  verwarming_test_stap:
    name: "Verwarming: nachttest, volgende stap"
    min: 0
    max: 100000
    step: 1
    mode: box
    icon: mdi:counter
input_datetime:
  verwarming_dag_start:
    name: "Verwarming: dag begint"
    has_date: false
    has_time: true
  verwarming_avond_start:
    name: "Verwarming: avond begint"
    has_date: false
    has_time: true
  verwarming_nacht_start:
    name: "Verwarming: nacht begint"
    has_date: false
    has_time: true
input_boolean:
  verwarming_test_aan:
    name: "Verwarming: nachttest aan"
    icon: mdi:flask-outline
input_text:
  verwarming_test_reeks:
    name: "Verwarming: nachttest, temperaturen"
    max: 80
